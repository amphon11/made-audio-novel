<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Made Audio Novel</title>
  <style>
    :root {
      --bg: #f6f5f2; --card: #ffffff; --text: #1f1f1f; --muted: #6b6b6b;
      --accent: #2f6f5e; --border: #dedbd4; --error: #b3261e;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #161816; --card: #1f2220; --text: #ececec; --muted: #a0a0a0;
        --accent: #6fbfa6; --border: #333733; --error: #f2b8b5;
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; background: var(--bg); color: var(--text);
      font-family: "Sarabun", "Noto Sans Thai", "Leelawadee UI", system-ui, sans-serif;
      line-height: 1.6;
    }
    main { max-width: 720px; margin: 0 auto; padding: 32px 16px; }
    h1 { margin: 0 0 4px; font-size: 1.6rem; }
    .sub { margin: 0 0 24px; color: var(--muted); }
    .card {
      background: var(--card); border: 1px solid var(--border);
      border-radius: 12px; padding: 20px; margin-bottom: 16px;
    }
    label { display: block; font-weight: 600; margin: 12px 0 6px; }
    label:first-child { margin-top: 0; }
    input[type=file], select { width: 100%; font: inherit; color: inherit; }
    select { padding: 8px; border-radius: 8px; border: 1px solid var(--border); background: var(--card); }
    input[type=range] { width: 100%; accent-color: var(--accent); }
    .row { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 16px; }
    button {
      font: inherit; padding: 10px 18px; border-radius: 8px; cursor: pointer;
      border: 1px solid var(--accent); background: var(--accent); color: var(--card);
    }
    button.secondary { background: transparent; color: var(--accent); }
    button:disabled { opacity: .5; cursor: wait; }
    #status { min-height: 1.6em; color: var(--muted); }
    #status.error { color: var(--error); }
    #preview {
      width: 100%; min-height: 200px; font: inherit; color: inherit;
      background: transparent; border: 1px solid var(--border); border-radius: 8px; padding: 10px;
    }
    audio { width: 100%; margin-top: 8px; }
    a { color: var(--accent); }
    [hidden] { display: none !important; }
  </style>
</head>
<body>
<main>
  <h1>Made Audio Novel</h1>
  <p class="sub">อัปโหลดนิยาย PDF ภาษาไทย แล้วแปลงเป็นไฟล์เสียง MP3</p>

  <form id="form" class="card">
    <label for="file">ไฟล์ PDF</label>
    <input id="file" name="file" type="file" accept="application/pdf,.pdf" required>

    <label for="voice">เสียงผู้อ่าน</label>
    <select id="voice" name="voice"></select>

    <label for="rate">ความเร็ว: <span id="rateLabel">0%</span></label>
    <input id="rate" name="rate" type="range" min="-50" max="100" step="5" value="0">

    <div class="row">
      <button type="button" id="previewBtn" class="secondary">ดูข้อความ</button>
      <button type="submit" id="convertBtn">แปลงเป็นเสียง</button>
    </div>
    <p id="status" role="status"></p>
  </form>

  <section id="textCard" class="card" hidden>
    <label for="preview">ข้อความที่ดึงได้ <span id="meta" class="sub"></span></label>
    <textarea id="preview" readonly></textarea>
  </section>

  <section id="audioCard" class="card" hidden>
    <label>ไฟล์เสียง</label>
    <audio id="player" controls></audio>
    <p><a id="download" download>ดาวน์โหลด MP3</a></p>
  </section>
</main>

<script>
  const $ = (id) => document.getElementById(id);
  const form = $("form");

  function setStatus(msg, isError = false) {
    $("status").textContent = msg;
    $("status").classList.toggle("error", isError);
  }

  function setBusy(busy) {
    $("previewBtn").disabled = busy;
    $("convertBtn").disabled = busy;
  }

  async function errorMessage(res) {
    try { return (await res.json()).detail || res.statusText; }
    catch { return res.statusText; }
  }

  async function loadVoices() {
    const res = await fetch("/api/voices");
    const data = await res.json();
    for (const [id, name] of Object.entries(data.voices)) {
      const opt = new Option(name, id, false, id === data.default);
      $("voice").add(opt);
    }
  }

  $("rate").addEventListener("input", (e) => {
    const v = Number(e.target.value);
    $("rateLabel").textContent = (v > 0 ? "+" : "") + v + "%";
  });

  $("previewBtn").addEventListener("click", async () => {
    if (!$("file").files.length) return setStatus("กรุณาเลือกไฟล์ PDF", true);
    const body = new FormData();
    body.append("file", $("file").files[0]);
    setBusy(true); setStatus("กำลังอ่าน PDF...");
    try {
      const res = await fetch("/api/extract", { method: "POST", body });
      if (!res.ok) throw new Error(await errorMessage(res));
      const data = await res.json();
      $("preview").value = data.text;
      $("meta").textContent = `(${data.pages} หน้า · ${data.characters.toLocaleString()} ตัวอักษร)`;
      $("textCard").hidden = false;
      setStatus("");
    } catch (err) {
      setStatus(err.message, true);
    } finally {
      setBusy(false);
    }
  });

  form.addEventListener("submit", async (e) => {
    e.preventDefault();
    const body = new FormData(form);
    setBusy(true); setStatus("กำลังแปลงเป็นเสียง อาจใช้เวลาหลายนาทีถ้าไฟล์ยาว...");
    try {
      const res = await fetch("/api/convert", { method: "POST", body });
      if (!res.ok) throw new Error(await errorMessage(res));
      const url = URL.createObjectURL(await res.blob());
      const name = $("file").files[0].name.replace(/\.pdf$/i, "") + ".mp3";
      $("player").src = url;
      $("download").href = url;
      $("download").download = name;
      $("audioCard").hidden = false;
      setStatus("เสร็จแล้ว");
    } catch (err) {
      setStatus(err.message, true);
    } finally {
      setBusy(false);
    }
  });

  loadVoices().catch(() => setStatus("โหลดรายชื่อเสียงไม่สำเร็จ", true));
</script>
</body>
</html>
